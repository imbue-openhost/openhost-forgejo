[app]
name = "forgejo"
version = "0.2.0"
description = "Forgejo code hosting with Cloud in a Bottle SSO admin and password auth for invited users"

[runtime.container]
image = "Dockerfile"
port = 3000

[routing]
health_check = "/api/healthz"
# Public so anonymous users can reach the login page (invited users
# log in with Forgejo-local passwords). The auth-proxy sidecar reads
# the router's X-OpenHost-Is-Owner header and stamps X-Openhost-User
# for the OpenHost owner; everyone else gets Forgejo's normal
# session/password auth.
public_paths = ["/"]

[resources]
memory_mb = 512
cpu_cores = 0.5

[data]
app_data = true
